server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Docker's embedded DNS, so upstream names resolve at request time (nginx
    # won't fail to start if adsb/nats aren't up yet).
    resolver 127.0.0.11 valid=10s ipv6=off;

    # SPA: serve files, fall back to index.html for client routes.
    location / {
        try_files $uri /index.html;
    }

    # Runtime config: never cache, so a mounted override takes effect.
    location = /config.json {
        add_header Cache-Control "no-store";
    }

    # ADS-B HTTP API: /adsb/api/... -> adsb:8080/api/...
    location /adsb/ {
        set $adsb_upstream http://adsb:8080;
        rewrite ^/adsb/(.*)$ /$1 break;
        proxy_pass $adsb_upstream;
    }

    # Simulator HTTP API: /sim/clock -> simulator:8000/clock
    location /sim/ {
        set $sim_upstream http://simulator:8000;
        rewrite ^/sim/(.*)$ /$1 break;
        proxy_pass $sim_upstream;
    }

    # NATS over WebSocket: /nats -> nats:8080/
    location /nats {
        set $nats_upstream http://nats:8080;
        rewrite ^/nats/?(.*)$ /$1 break;
        proxy_pass $nats_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }
}
